<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lec04 - Introduction to CSS</title>
    <!-- External CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Internal CSS -->
    <style>
        /* Tag Selector */
        body {
            background-color: black;
            color: white;
        }
        p {
            color: teal;
            border-bottom: 2px solid black;
        }

        button {
            background-color: darkorange;
            color: black;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <!-- Inline CSS -->
    <h2 style="color: blue; font-size: 32px; border: 4px solid black;">Welcome to our website</h2>
    <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Voluptas sunt eius maxime assumenda corrupti accusantium architecto quod odit! Sapiente excepturi voluptatum tempore voluptates quis vel ab asperiores molestiae, architecto recusandae.</p>
    <button>See more</button>

    <p>ABCDEFG</p>
    <button>Learn More</button>

    <b>Uzair</b>
    <i>Umair</i>
    <u>Hussain</u>
</body>
</html>
