<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lec05 - CSS Selectors</title>
    <style>
        /* Universal Selector */
        * {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        /* Tag Selector */
        p {
            color: teal;
        }

        #para {
            color: red;
        }

        .green {
            color: green;
        }

        .blue {
            color: blue;
        }
    </style>
</head>

<body>
    <h1>Hello World</h1>
    <p class="green">Paragraph #1</p>
    <p class="green">Paragraph #2</p>
    <p class="green">Paragraph #3</p>
    <p id="para">Paragraph #4</p>
    <p class="blue">Paragraph #5</p>
    <p class="blue">Paragraph #6</p>
    <p>Paragraph #7</p>
    <p>Paragraph #8</p>
    <p>Paragraph #9</p>
    <p class="green">Paragraph #10</p>
    <p>Paragraph #11</p>
    <button>See More</button>
</body>

</html>
